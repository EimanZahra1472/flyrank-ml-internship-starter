<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="20" font-weight="700" fill="#1e293b">Warehouse Forward Model Validation Collapse &amp; Autocorrelation Trap</text>
  <text x="40" y="70" font-size="13" fill="#64748b">78.8M Warehouse Facts | Naive Random Split vs. Honest Out-of-Time Split | ML-09 Audit</text>

  <!-- Left Panel: Split Accuracy Comparison -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="340" height="340" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">1. Predictive Accuracy Collapse</text>
    <text x="20" y="50" font-size="12" fill="#64748b">Train: Feb→Mar | Test: Apr→May</text>

    <!-- Grid -->
    <line x1="60" y1="260" x2="300" y2="260" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="60" y1="200" x2="300" y2="200" stroke="#e2e8f0" stroke-dasharray="3" />
    <line x1="60" y1="140" x2="300" y2="140" stroke="#e2e8f0" stroke-dasharray="3" />
    <line x1="60" y1="80" x2="300" y2="80" stroke="#e2e8f0" stroke-dasharray="3" />

    <!-- Labels -->
    <text x="50" y="264" font-size="11" fill="#64748b" text-anchor="end">0.0</text>
    <text x="50" y="204" font-size="11" fill="#64748b" text-anchor="end">0.3</text>
    <text x="50" y="144" font-size="11" fill="#64748b" text-anchor="end">0.6</text>
    <text x="50" y="84" font-size="11" fill="#64748b" text-anchor="end">0.9</text>

    <!-- Bars -->
    <!-- Naive Split: 0.669 -> height = 0.669/0.9 * 180 = 133.8, y = 260 - 133.8 = 126.2 -->
    <rect x="95" y="126" width="60" height="134" rx="4" fill="#3b82f6" />
    <text x="125" y="116" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">66.9%</text>
    <text x="125" y="280" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Naive Split</text>
    <text x="125" y="295" font-size="10" fill="#64748b" text-anchor="middle">(Time-Mixed)</text>

    <!-- Honest Split: 0.274 -> height = 0.274/0.9 * 180 = 54.8, y = 260 - 54.8 = 205.2 -->
    <rect x="200" y="205" width="60" height="55" rx="4" fill="#ef4444" />
    <text x="230" y="195" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">27.4%</text>
    <text x="230" y="280" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Honest Split</text>
    <text x="230" y="295" font-size="10" fill="#991b1b" text-anchor="middle">(Time-Aware Out-of-Period)</text>

    <rect x="20" y="310" width="300" height="20" rx="3" fill="#fee2e2" />
    <text x="170" y="324" font-size="10.5" font-weight="600" fill="#991b1b" text-anchor="middle">Model Killed: Below Majority-Class Guess</text>
  </g>

  <!-- Right Panel: Feature Autocorrelation -->
  <g transform="translate(420, 95)">
    <rect x="0" y="0" width="340" height="340" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">2. The Near-Leakage Mechanism</text>
    <text x="20" y="50" font-size="12" fill="#64748b">Correlation with future_avg_position ($r$)</text>

    <!-- Bar: avg_position -> 0.819 -->
    <text x="20" y="90" font-size="12" font-weight="700" fill="#dc2626">avg_position (0.819) ⚠️ Near-Leak</text>
    <rect x="20" y="100" width="280" height="24" rx="4" fill="#e2e8f0" />
    <rect x="20" y="100" width="229" height="24" rx="4" fill="#dc2626" />
    <text x="255" y="117" font-size="12" font-weight="700" fill="#dc2626">0.819</text>

    <!-- Bar: word_count -> 0.215 -->
    <text x="20" y="145" font-size="12" fill="#475569">word_count (0.215)</text>
    <rect x="20" y="153" width="280" height="18" rx="4" fill="#e2e8f0" />
    <rect x="20" y="153" width="60" height="18" rx="4" fill="#64748b" />
    <text x="88" y="167" font-size="11" fill="#475569">0.215</text>

    <!-- Bar: avg_ctr -> -0.209 -->
    <text x="20" y="193" font-size="12" fill="#475569">avg_ctr (-0.209)</text>
    <rect x="20" y="201" width="280" height="18" rx="4" fill="#e2e8f0" />
    <rect x="20" y="201" width="58" height="18" rx="4" fill="#64748b" />
    <text x="86" y="215" font-size="11" fill="#475569">|-0.209|</text>

    <!-- Bar: days_since_update -> 0.145 -->
    <text x="20" y="241" font-size="12" fill="#475569">days_since_update (0.145)</text>
    <rect x="20" y="249" width="280" height="18" rx="4" fill="#e2e8f0" />
    <rect x="20" y="249" width="41" height="18" rx="4" fill="#64748b" />
    <text x="69" y="263" font-size="11" fill="#475569">0.145</text>

    <!-- Explanatory note -->
    <text x="20" y="295" font-size="11" fill="#64748b">Because target is defined as future_avg_position &gt;</text>
    <text x="20" y="310" font-size="11" fill="#64748b">avg_position, extreme autocorrelation acts as a brittle shortcut.</text>
  </g>
</svg>
